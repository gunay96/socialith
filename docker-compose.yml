name: socialith

services:
  postgres:
    image: postgres:16-alpine
    container_name: socialith-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: socialith
      POSTGRES_PASSWORD: socialith
      POSTGRES_DB: socialith
    ports:
      - "5432:5432"
    volumes:
      - socialith_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialith -d socialith"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: socialith-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - socialith_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  socialith_postgres_data:
  socialith_redis_data:
