# Overlay for verifying the VPS stack on a developer machine WITHOUT a real
# domain, certificate or exposed ports 80/443. Use together with the main file
# and a throwaway env file (see docs/VPS_DEPLOYMENT.md §"Local verification"):
#
#   docker compose -p socialith-p1 \
#     -f infra/vps/docker-compose.yml -f infra/vps/docker-compose.local-verify.yml \
#     --env-file <throwaway.env> up -d --build
#
# Separate project name (-p socialith-p1) ⇒ separate containers, network and
# volumes: it can never touch the legacy PostgreSQL stack. Never use this file
# for a real deployment.
services:
  caddy:
    environment:
      # Caddy's own internal CA instead of Let's Encrypt (the test domain is not public).
      CADDY_GLOBAL_EXTRA: local_certs
    ports: !override
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
