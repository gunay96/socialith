# Redis for Socialith: BullMQ queues, sessions and rate-limit counters.
# The password is passed on the command line from REDIS_PASSWORD (compose).

# Durability: append-only file, fsync once per second — at most ~1 s of
# queue/session writes can be lost on a hard crash. RDB snapshots are kept as a
# second, compact recovery point.
appendonly yes
appendfsync everysec
save 900 1
save 300 100
save 60 10000

# BullMQ requires that Redis NEVER evicts keys; running out of memory must be a
# loud error, not silent job loss.
maxmemory 400mb
maxmemory-policy noeviction

# Never reachable from outside the compose network (no port is published).
protected-mode yes
