# Local Cloudflare Tunnel demo only — mirrors the single-domain,
# path-based routing documented for real production
# (docs/deployment-guzelhosting.md's Nginx config), just running inside
# the compose network instead of on a VPS host. api/web are reached by
# their real container hostnames on the compose network, never via a
# host port.
server {
    listen 80;
    server_name _;

    # cloudflared terminates TLS at Cloudflare's edge and forwards this
    # tunnel plain HTTP — it does NOT re-terminate TLS locally, so nginx
    # never sees an HTTPS connection directly. X-Forwarded-Proto is
    # hardcoded to https here (safe specifically because a quick tunnel's
    # only real entry point is Cloudflare's own HTTPS edge) so
    # apps/api/src/app.ts's `trust proxy` + any secure-cookie logic see
    # the real originating scheme, not this hop's actual (plain) one.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Mounted at the API's root (not under /api — see apps/api/src/app.ts's
    # healthRouter mount), so it needs its own location block here.
    location /health {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
